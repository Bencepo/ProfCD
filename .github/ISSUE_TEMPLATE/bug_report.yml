name: Bug report
description: Something in ProfCD does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Short reports are fine, an error text helps the most.
        No GitHub account? Leave a comment on [CurseForge](https://www.curseforge.com/wow/addons/profcd#comments) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the window with /pcd
        2. Look at the row for Transmute: Arcanite
        3. ...
  - type: textarea
    id: error
    attributes:
      label: Lua error text
      description: Copy it from BugSack/BugGrabber, or turn errors on with `/console scriptErrors 1` and reproduce.
      render: text
  - type: input
    id: version
    attributes:
      label: ProfCD version
      description: Shown in the addon list or on the CurseForge file page.
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Class, level and realm type
      placeholder: e.g. Druid 34, PvE
  - type: textarea
    id: professions
    attributes:
      label: Professions and the cooldown in question
      placeholder: e.g. Alchemy 300, Transmute: Arcanite shows Ready but is on cooldown
  - type: textarea
    id: addons
    attributes:
      label: Other addons
      description: Especially other cooldown trackers. Does the bug still happen with only ProfCD enabled?
